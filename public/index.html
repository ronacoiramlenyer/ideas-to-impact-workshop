<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>From Ideas to Impact</title>
<style>
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --surface2:#EEEAE0; --ink:#1B2430; --muted:#586272; --line:#D9D3C5;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --accent-soft:#E2ECF8; --gold:#8A5A00; --gold-soft:#FBEFD2;
  --ok:#23704A; --ok-soft:#DDF1E4; --bad:#B03A3A;
  --b-low:#BFE3C8; --b-med:#F7E6A1; --b-high:#F6C28E; --b-ext:#EE9A9A; --b-ink:#1B2430;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161E; --surface:#192230; --surface2:#222D3D; --ink:#ECEFF4; --muted:#9DA9BA; --line:#2E3A4D;
    --accent:#7FB2FF; --accent-ink:#0B1626; --accent-soft:#1D2D45; --gold:#F2B84B; --gold-soft:#3A2E12;
    --ok:#6FD39B; --ok-soft:#183626; --bad:#FF8D8D;
  }
}
:root[data-theme="dark"]{
  --bg:#10161E; --surface:#192230; --surface2:#222D3D; --ink:#ECEFF4; --muted:#9DA9BA; --line:#2E3A4D;
  --accent:#7FB2FF; --accent-ink:#0B1626; --accent-soft:#1D2D45; --gold:#F2B84B; --gold-soft:#3A2E12;
  --ok:#6FD39B; --ok-soft:#183626; --bad:#FF8D8D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{min-height:100vh;padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
h1,h2,h3{line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.muted{color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{resize:vertical;min-height:96px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* home */
.home{max-width:1100px;margin:0 auto}
.hero{padding:18px 0 8px}
.hero .k{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.hero h1{font-size:clamp(30px,5vw,52px);margin:6px 0 8px}
.hero p{margin:0;color:var(--muted);max-width:60ch;font-size:clamp(16px,2vw,19px)}
.strip{display:flex;gap:3px;margin:20px 0 6px;height:12px}
.strip i{display:block;border-radius:4px;background:var(--accent);opacity:.85}
.strip i:nth-child(even){opacity:.55}
.segs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px}
.seg{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px}
.seg:hover{border-color:var(--accent)}
.seg .n{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
.seg h2{font-size:22px}
.seg .m{margin-top:auto;padding-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.join{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* slide view */
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top .ttl{font-weight:700}
.top .sp{flex:1}
.tmr{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:68px;text-align:center}
.tmr.over{color:var(--bad)}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:1000px){.stage.withp{grid-template-columns:minmax(0,1fr) clamp(300px,25vw,380px)}}
/* Projector: the whole presenter view fits the screen; Back/Next never scroll away. */
@media (min-width:1000px) and (min-height:480px){
  #app.deck{height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:12px;padding-bottom:12px}
  #app.deck .top{margin-bottom:10px}
  #app.deck .stage{flex:1;min-height:0}
  #app.deck .slide{min-height:0;overflow:auto}
  #app.deck #panel{min-height:0;overflow:auto}
  #app.deck .bottom{margin-top:10px}
  #app.deck .wall{max-height:none}
  #app.deck .slide h2{margin-bottom:8px}
  #app.deck table.t input{min-height:30px;padding:3px 8px}
  #app.deck table.t th,#app.deck table.t td{padding-top:min(6px,.8vh);padding-bottom:min(6px,.8vh)}
}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,min(3vw,4.5vh),40px);min-height:55vh}
.slide .kick{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.slide h2{font-size:clamp(24px,min(4vw,6.2vh),44px);margin:4px 0 min(16px,2vh)}
.slide p,.slide li{font-size:clamp(15px,min(1.9vw,3.1vh),22px)}
.slide ul{padding-left:1.2em;margin:.4em 0}
.slide li{margin:.35em 0}
.bottom{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.box{background:var(--surface2);border-radius:12px;padding:14px 16px}
.box b{display:block;margin-bottom:2px}
.formula{background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:10px;padding:14px 18px;font-size:clamp(18px,2.3vw,26px);font-weight:600}
.blank{color:var(--gold);background:var(--gold-soft);border-radius:6px;padding:0 6px}
.weak{border-left:5px solid var(--bad)} .strong{border-left:5px solid var(--ok)}
table.t{border-collapse:collapse;width:100%;font-size:clamp(13px,min(1.6vw,2.5vh),18px)}
table.t th,table.t td{border:1px solid var(--line);padding:min(8px,1vh) 10px;text-align:left;vertical-align:top;line-height:1.35}
table.t th{background:var(--surface2)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t input{min-height:34px;padding:4px 8px}
table.itm td,table.itm th{vertical-align:middle}
.itsum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;margin-top:12px;align-items:end}
.itsum .box .big{display:block}
.tw{overflow-x:auto}
.big{font-size:clamp(34px,6vw,64px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.form3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.form3 label{font-size:14px;font-weight:600;display:block;margin-bottom:4px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pick button{min-width:46px;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:6px 12px}
.pick button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pick.col{flex-direction:column}
.pick.col button{text-align:left;font-weight:500;padding:12px 14px}
.mx{display:grid;grid-template-columns:34px repeat(5,1fr);gap:4px;max-width:420px}
.mx div{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:8px;font-weight:700;color:var(--b-ink)}
.mx .h{background:transparent;color:var(--muted);font-size:13px}
.mx .low{background:var(--b-low)} .mx .med{background:var(--b-med)} .mx .high{background:var(--b-high)} .mx .ext{background:var(--b-ext)}
.mx .sel{outline:3px solid var(--ink);outline-offset:1px}
.bd{display:inline-block;border-radius:8px;padding:2px 10px;font-weight:700;color:var(--b-ink)}
.bd.low{background:var(--b-low)} .bd.med{background:var(--b-med)} .bd.high{background:var(--b-high)} .bd.ext{background:var(--b-ext)}

/* qr */
.qr{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.qr svg{width:var(--qs);height:var(--qs);display:block;border-radius:8px}
.qrl{font-weight:700;font-size:14px;word-break:break-all;text-align:center}
.opening{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
.joinbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface2);border-radius:var(--r);padding:16px;max-width:300px}
.steps li{margin:.3em 0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:min(16px,2vh)}
@media (max-width:700px){.opening{grid-template-columns:1fr}.joinbox{max-width:none}}
.join .jt{display:flex;flex-direction:column;gap:4px;flex:1;min-width:220px}

.houses{margin-top:16px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper b{min-width:2ch;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hchip{border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:14px;color:var(--muted)}
.hchip.some{color:var(--ink);border-color:var(--accent)}
.hchip.full{background:var(--gold-soft);color:var(--gold);border-color:var(--gold)}
/* collapsible questions panel */
.ptab{display:none}
.stage.collapsed #panel{display:none}
.stage.collapsed .ptab{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 12px;font-weight:700;color:var(--accent)}
.stage.collapsed .ptab.cue{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.ptab b{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 8px;font-size:13px}
@media (min-width:1000px){
  .stage.withp{transition:grid-template-columns .25s ease}
  .stage.withp.collapsed{grid-template-columns:minmax(0,1fr) 44px}
  .stage.collapsed .ptab{flex-direction:column;padding:12px 0;height:100%;max-height:340px}
  .stage.collapsed .ptab span{writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.06em}
}
@media (prefers-reduced-motion:reduce){.stage.withp{transition:none}}
.hint{background:var(--gold-soft);color:var(--gold);border-radius:8px;padding:6px 10px;font-weight:600;font-size:14px;margin:8px 0 2px}
.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.def{background:var(--surface2);border-radius:12px;padding:10px 14px;border-top:4px solid var(--accent)}
.def>b{display:block;font-size:clamp(18px,min(2.2vw,3.4vh),26px)}
.def p{margin:2px 0 4px;line-height:1.4}
.def .ex{display:block;color:var(--muted);font-size:clamp(14px,min(1.6vw,2.5vh),18px)}
.def .ex::before{content:'Example: ';font-weight:700}
@media (max-width:700px){.defs{grid-template-columns:1fr}}
table.xm th,table.xm td{text-align:center;vertical-align:middle}
table.xm tbody th{text-align:left;white-space:nowrap}
table.xm td{font-weight:800;color:var(--b-ink);font-size:1.15em}
.xkey{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:12px;font-size:clamp(15px,min(1.8vw,2.9vh),21px)}
.xkey i{display:inline-block;width:18px;height:18px;border-radius:4px;vertical-align:-3px;margin-right:6px}
.xkey i.low{background:var(--b-low)} .xkey i.high{background:var(--b-high)}
table.xm td small{display:block;font-weight:600;opacity:.65;font-size:.8em}
table.xm td.low{background:var(--b-low)} table.xm td.med{background:var(--b-med)} table.xm td.high{background:var(--b-high)} table.xm td.ext{background:var(--b-ext)}
.loop{display:grid;grid-template-columns:minmax(0,1fr) 130px minmax(0,1fr) 130px minmax(0,1fr);gap:0;align-items:stretch}
.lnode{background:var(--surface2);border-radius:12px;border-top:5px solid var(--accent);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:clamp(14px,min(1.6vw,2.6vh),19px);position:relative}
.lnode b{font-size:clamp(17px,min(2vw,3.2vh),24px);line-height:1.15}
.lnode i{color:var(--gold);font-weight:700;font-style:normal}
.lnode .ln{position:absolute;top:-14px;right:10px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.larrow{display:flex;align-items:center;justify-content:center;position:relative}
.larrow::before{content:'';position:absolute;left:6px;right:14px;top:50%;border-top:3px solid var(--accent)}
.larrow::after{content:'';position:absolute;right:4px;top:calc(50% - 8px);border:8px solid transparent;border-left:12px solid var(--accent);border-right:0}
.larrow span{position:absolute;left:8px;right:8px;bottom:calc(50% + 8px);color:var(--muted);font-size:13px;line-height:1.25;text-align:center}
.lback{grid-column:1/-1;display:flex;gap:12px;align-items:center;margin-top:16px;background:var(--ok-soft);border-radius:12px;padding:12px 16px;font-size:clamp(15px,min(1.7vw,2.7vh),20px)}
.lback .lret{font-size:clamp(28px,4vh,40px);color:var(--ok);font-weight:800;line-height:1}
@media (max-width:800px){.loop{grid-template-columns:1fr}.larrow{height:44px}.larrow::before{left:50%;right:auto;top:4px;bottom:12px;border-top:0;border-left:3px solid var(--accent)}.larrow::after{left:calc(50% - 7px);right:auto;top:auto;bottom:0;border:8px solid transparent;border-top:12px solid var(--accent);border-bottom:0}.larrow span{position:static;margin:0 0 0 64px;text-align:left;align-self:center}}
.hloop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hcol{background:var(--surface2);border-radius:12px;border-top:5px solid var(--accent);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.hcol:last-child{border-top-color:var(--ok)}
.hcol>b{font-size:clamp(15px,min(1.7vw,2.7vh),20px)}
.hh{display:flex;gap:8px;align-items:flex-start;font-size:clamp(13px,min(1.5vw,2.4vh),17px);line-height:1.3}
.hh .hn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--gold);color:var(--surface);font-weight:800;display:flex;align-items:center;justify-content:center}
.hh strong{display:block}
.hh small{display:block;color:var(--muted);font-size:.9em}
.hfinal{font-size:clamp(22px,min(3vw,4.6vh),36px);font-weight:800;color:var(--accent);margin:18px 0 4px;line-height:1.2}
@media (max-width:800px){.hloop{grid-template-columns:1fr 1fr}}
.qr[data-act=qrzoom]{cursor:zoom-in}
.qr[data-act=qrzoom]:hover svg,.qr[data-act=qrzoom]:focus-visible svg{outline:3px solid var(--accent);outline-offset:3px}
.qrbig{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:2vmin}
.qrbox{background:#fff;border-radius:16px;padding:2.5vmin;display:flex;flex-direction:column;align-items:center;gap:1.5vmin}
.qrbox svg{width:min(80vh,86vw);height:min(80vh,86vw);display:block}
.qrbl{color:#111;font-weight:800;font-size:clamp(18px,3.4vh,34px);text-align:center;word-break:break-all}
.hero{display:flex;align-items:center;gap:24px}
.hero .htext{flex:1;min-width:0}
.regcount{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:clamp(140px,16vw,240px);padding:12px 20px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent)}
.regcount b{font-size:clamp(56px,8vw,120px);line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.regcount span{font-size:clamp(16px,1.8vw,24px);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.regcount b.bump{animation:bump .5s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.regcount b.bump{animation:none}}
@media (max-width:640px){.hero{flex-direction:column;align-items:flex-start}}
.work{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:.8em;align-items:start}
.wsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35em;counter-reset:w}
.wsteps li{display:flex;gap:.6em;align-items:flex-start;background:var(--surface2);border-radius:12px;padding:.32em .6em;border-left:6px solid var(--line);margin:0;font-size:.78em;line-height:1.28}
.wsteps li b{display:block}
.wsteps li small{display:block;color:var(--muted);font-size:.82em}
.wsteps .wm{flex:none;font-weight:800;color:var(--gold);min-width:3.6em}
.wsteps li.on{border-left-color:var(--accent);background:var(--accent-soft)}
.wsteps li.done{opacity:.55}
.wside{display:flex;flex-direction:column;gap:.5em}
.wtimer{background:var(--surface2);border-radius:12px;padding:.5em;text-align:center}
.wt{display:block;font-size:2.6em;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.wt.over{color:var(--bad)}
.wbtns{display:flex;gap:.4em;justify-content:center;margin-top:.3em}
.wbtns .btn{font-size:.7em}
.wcheck{background:var(--ok-soft);border-radius:12px;padding:.5em .7em;font-size:.75em;line-height:1.35}
.wcheck b{display:block;color:var(--ok)}
@media (max-width:800px){.work{grid-template-columns:1fr}}
/* panel */
#panel{display:flex;flex-direction:column;gap:12px}
.ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pq{font-weight:700;font-size:17px;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.wall{display:grid;gap:8px;max-height:46vh;overflow:auto}
.note{background:var(--surface2);border-radius:10px;padding:10px 12px}
.note small{display:block;color:var(--muted);margin-top:2px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0;font-size:15px}
.bar .tr{grid-column:1/-1;height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent)}
.bar.right .tr i{background:var(--ok)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;max-width:90vw}

#net{position:fixed;left:0;right:0;top:0;z-index:10;background:var(--gold-soft);color:var(--gold);border-bottom:1px solid var(--gold);padding:8px 16px;font-weight:600;text-align:center;font-size:15px}
.sent.wait{background:var(--gold-soft);color:var(--gold)}
.bank{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:15px;line-height:1.35}
.bq.done{opacity:.7;border-style:dashed}
.bq .bo{font-size:13px;margin-top:2px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0 4px}
#askd summary{cursor:pointer}
.brgys{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.brgys button{min-height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:6px 10px;overflow-wrap:anywhere}
.brgys button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card.myhouse{display:flex;flex-direction:column;gap:2px;text-align:center;border-color:var(--gold);background:var(--gold-soft)}
.card.myhouse b{font-size:30px;color:var(--gold);line-height:1.15}
.brgyed{margin-top:12px;max-width:520px}

 {t:'Start with the result, not the activity',k:'Part 1 · Plan Responsibly',body:function(){return '<div class="grid2"><div class="box weak"><b>Weak</b>"Hold a basketball league."</div><div class="box strong"><b>Strong</b>"Keep 60 youth active and off the streets for one summer, shown by weekly attendance."</div></div><p>An objective says what changes, for whom, and how we will know.</p><div class="formula">To <span class="blank">do what</span> for <span class="blank">whom</span> so that <span class="blank">result</span>, measured by <span class="blank">KPI</span>, target <span class="blank">number</span>, by <span class="blank">date</span>.</div>'},habitCheck:true,prompt:{base:'h2',type:'choice',q:'Start with the result, not the activity. Which habit is that?',options:['1 Be Proactive','2 Begin with the End in Mind','3 Put First Things First','4 Think Win-Win','5 Seek First to Understand','6 Synergize','7 Sharpen the Saw'],correct:1}},
 {id:'objb',t:'Build an objective',k:'Try it together',body:function(){return '<div class="form3"><div><label>To (do what)</label><input type="text" data-f="a" placeholder="e.g. train youth in basic first aid"></div><div><label>for (whom)</label><input type="text" data-f="b" placeholder="e.g. 40 youth of our barangay"></div><div><label>so that (result)</label><input type="text" data-f="c" placeholder="e.g. they can respond to emergencies"></div><div><label>measured by (KPI)</label><input type="text" data-f="d" placeholder="e.g. passing a skills check"></div><div><label>target (number)</label><input type="text" data-f="e" placeholder="e.g. 32 of 40"></div><div><label>by (date)</label><input type="text" data-f="f" placeholder="e.g. March 30"></div></div><div class="formula" id="objOut" style="margin-top:16px"></div><div class="row"><button class="btn sm" data-act="objex">Fill an example</button><button class="btn sm ghost" data-act="objclr">Clear</button></div>'},init:function(root){
   var F={a:'',b:'',c:'',d:'',e:'',f:''};
   function w(k,l){return F[k]?'<b>'+esc(F[k])+'</b>':'<span class="blank">'+l+'</span>'}
   function draw(){$('#objOut',root).innerHTML='To '+w('a','do what')+' for '+w('b','whom')+' so that '+w('c','result')+', measured by '+w('d','KPI')+', target '+w('e','number')+', by '+w('f','date')+'.'}
   root.addEventListener('input',function(e){var f=e.target.getAttribute('data-f');if(f){F[f]=e.target.value;draw()}});
   root.addEventListener('click',function(e){var a=e.target.getAttribute('data-act');
     var ex={a:'train youth in basic first aid',b:'40 youth of our barangay',c:'they can respond to emergencies',d:'passing a skills check',e:'32 of 40',f:'March 30'};
     if(a==='objex'){F=Object.assign({},ex)}else if(a==='objclr'){F={a:'',b:'',c:'',d:'',e:'',f:''}}else return;
     root.querySelectorAll('[data-f]').forEach(function(i){i.value=F[i.getAttribute('data-f')]});draw()});
   draw();}},
 {t:'Objective, then evaluation',k:'How will we know?',body:function(){return '<p>Every objective needs <b>evidence</b>, <b>who</b> collects it, and <b>when</b>. Fill the Actual column after the activity.</p>'+tbl(['Objective','Evidence','Who collects','When','Actual (after)'],[['Train 40 youth in basic first aid, 32 pass the skills check by March 30','Skills check sheets','Kagawad on health','At the end of the training day','<span class="muted">filled in after</span>']])+'<p class="muted">No evidence, no evaluation. If you cannot say how you will check it, rewrite the objective.</p>'}},
 {t:'Which one is measurable?',k:'Quick check',body:function(){return '<p>Pick the objective you could actually evaluate.</p>'},prompt:{base:'quiz1',type:'choice',q:'Which objective is measurable?',options:['To help youth become more active in the barangay.','To train 40 youth in basic first aid so that they can respond to emergencies, measured by passing a skills check, target 32 of 40, by March 30.','To hold a successful first aid seminar.','To raise awareness about first aid.'],correct:1}},
 {t:'Your team\'s objective',k:'Team exercise',body:function(){return '<p>In your team, write <b>one objective</b> for your activity using the formula.</p><div class="formula">To <span class="blank">do what</span> for <span class="blank">whom</span> so that <span class="blank">result</span>, measured by <span class="blank">KPI</span>, target <span class="blank">number</span>, by <span class="blank">date</span>.</div><p>One person types it on their phone. We read a few aloud and tighten them together.</p>'},prompt:{base:'obj',type:'text',q:'Type your team\'s objective in one sentence, using the formula.'}},
 workSlide({t:'Team work: page 1',k:'Team work · 13 min · proposal page 1',steps:[[3,'Description and need','What is it, and why is it needed?'],[4,'Objectives','2 to 3, each with a KPI and a target, using the formula.'],[3,'Evaluation plan','For each objective: the evidence, who collects it, and when.'],[3,'Who, when, where, how','Participants (count those under 18), date and full venue address, adults in charge, and the program with one owner per item.']],check:'Could someone who was not here run this from page 1? Could someone check each objective with the evidence you listed?'}),
]},
{id:'p2',n:'Part 2 · Budget Transparently',min:16,tag:'Itemize so anyone can check every line, see where the money goes, and keep the budget open after approval.',slides:[
 {t:'Itemize everything',k:'Part 2 · Budget Transparently',body:function(){return '<ul><li>List every item with <b>Qty, Unit, Unit Cost</b>. Then Total.</li><li>The total is a <b>result</b> of the list, not a starting point.</li><li>Keep an <b>Actual (PHP)</b> column and fill it in after the activity.</li><li>Any risk action that costs money needs <b>its own budget line</b>.</li></ul>'}},
 {id:'itemizer',t:'Itemize, total, cost per participant',k:'Try it',body:function(){return '<div class="tw"><table class="t itm" id="itm"><colgroup><col><col style="width:12%"><col style="width:13%"><col style="width:17%"><col style="width:17%"></colgroup><thead><tr><th>Item</th><th class="num">Qty</th><th>Unit</th><th class="num">Unit cost (PHP)</th><th class="num">Total</th></tr></thead><tbody></tbody><tfoot><tr><th colspan="4" class="num"><button class="btn sm" data-act="addrow" style="float:left">Add a row</button>Total</th><th class="num" id="itTot"></th></tr></tfoot></table></div><div class="itsum"><div><label class="lab">Participants</label><input type="number" id="itPax" value="40" min="1"></div><div class="box"><b>Cost per participant</b><span class="big" id="itPer"></span><span class="muted" id="itEq"></span></div></div>'},init:function(root){
   /* Item, Qty, Unit, Unit cost. 8,000 + 4,000 + 3,000 + 3,000 = 18,000; 18,000 / 40 = 450. */
   var rows=[['Meals',40,'pax',200],['Materials',40,'sets',100],['Venue and sound',1,'lot',3000],['First aid kit and tarpaulin',1,'lot',3000]];
   function cell(i,f,type,v){return '<input type="'+type+'" data-i="'+i+'" data-f="'+f+'" value="'+esc(v)+'">'}
   function drawRows(){$('#itm tbody',root).innerHTML=rows.map(function(r,i){return '<tr><td>'+cell(i,0,'text',r[0])+'</td><td class="num">'+cell(i,1,'number',r[1])+'</td><td>'+cell(i,2,'text',r[2])+'</td><td class="num">'+cell(i,3,'number',r[3])+'</td><td class="num" id="rt'+i+'"></td></tr>'}).join('');calc()}
   function calc(){var t=0;rows.forEach(function(r,i){var x=num(r[1])*num(r[3]);t+=x;var c=$('#rt'+i,root);if(c)c.textContent=peso(x)});
     $('#itTot',root).textContent=peso(t);var p=num($('#itPax',root).value);$('#itPer',root).textContent=p>0?peso(t/p):'—';$('#itEq',root).textContent=p>0?peso(t)+' ÷ '+p+' participants':''}
   root.addEventListener('input',function(e){var t=e.target;if(t.id==='itPax'){calc();return}var i=t.getAttribute('data-i');if(i!==null){rows[+i][+t.getAttribute('data-f')]=t.value;calc()}});
   root.addEventListener('click',function(e){if(e.target.getAttribute('data-act')==='addrow'){rows.push(['',1,'',0]);drawRows();var ins=root.querySelectorAll('#itm tbody tr:last-child input');if(ins[0])ins[0].focus()}});
   drawRows();}},
 {t:'Make it checkable',k:'Transparent means anyone can check it',body:function(){return tbl(['Do this','Why'],[['<b>One line per expense</b>','"Food, PHP 5,000" is a lump sum, not a budget line.'],['<b>Show the arithmetic</b>','Qty × Unit Cost = Total, and the total adds up. Anyone can redo it with a calculator.'],['<b>Explain in Remarks</b>','The assumption behind the number, like "30 participants plus 5 staff."'],['<b>Attach proof</b>','Quotations for larger items.'],['<b>Name the source of funds</b>','On one line. The SK Treasurer checks the sheet before it is submitted.'],['<b>Keep it open</b>','Post the approved budget where the community can see it. After the activity, fill in the Actual column.']])}},
 {t:'"What if the budget is just this much?"',k:'Three steps',body:function(){return '<div class="grid2"><div class="box"><b>1. Start from the objective</b>What result must still happen? Protect that first.</div><div class="box"><b>2. Do the math backwards</b>Budget ÷ cost per participant. Cut the number of participants or the cost per head, not the purpose.</div><div class="box"><b>3. Never cut safety</b>First aid, headcounts, and a safe venue always stay in the budget. Trim extras first. If you still cannot afford a safety item, shrink or shorten the activity, or drop the risky part. Never drop the safety item.</div></div>'}},
 workSlide({t:'Team work: page 2, the budget',k:'Team work · 10 min · proposal page 2',steps:[[5,'Cost your program','8 to 10 lines from your Part 1 program: Qty, Unit, Unit Cost, Total, and Remarks.'],[2,'Cost per participant','Write it under the total. Is this where we want the money to go?'],[3,'Swap and check','A neighbor team re-adds your total and marks any line they cannot explain.']],check:'Every program item has a cost, and every cost traces back to a program item.',prompt:{base:'cpp',type:'text',q:'Your team\'s cost per participant, and what it mostly buys.'}}),
]},
{id:'p3',n:'Part 3 · Manage Risks Proactively',min:40,tag:'Rate each risk as Occurrence + Impact, choose a treatment, then build your Risk Register.',slides:[
 {t:'Four words first',k:'Part 3 · Manage Risks Proactively',body:function(){return '<div class="defs">'
   +'<div class="def"><b>Risk</b><p>What could go wrong and hurt the activity.</p><span class="ex">A participant sprains an ankle.</span></div>'
   +'<div class="def"><b>Control</b><p>Acts <b>before or during</b> the activity to stop the risk or catch it early. <b>Lowers Occurrence.</b> Existing ones are already in place; Additional ones are what you add.</p><span class="ex">Safety briefing, venue check, headcounts.</span></div>'
   +'<div class="def"><b>Mitigation</b><p>Limits the damage <b>if the risk happens anyway</b>. <b>Lowers Impact.</b></p><span class="ex">First aid, nearest health facility, inform guardians.</span></div>'
   +'<div class="def"><b>Risk Treatment</b><p>What you decide to do about the risk, based on its rating: <b>Accept</b> (6 and below), or <b>Reduce</b>, <b>Transfer / Share</b>, or <b>Avoid</b> (above 6).</p><span class="ex">Rated 7, above 6 → Reduce, and the Committee approves.</span></div>'
   +'</div>'}},
 {t:'How big is the risk?',k:'Rate it',body:function(){return '<div class="formula">Risk Rating = Occurrence + Impact</div><p><b>Rate twice.</b> First as the risk stands today, with your Existing Controls. Then the <b>Residual Risk Rating</b> you expect after your Additional Controls and Mitigation. It is a target: recheck it when those are done.</p>'}},
 {t:'Occurrence: how likely?',k:'Scale 1 to 5',body:function(){return tbl(['Rating','Level','How likely is it?'],OCC.map(function(r){return ['<b>'+r[0]+'</b>',r[1],r[2]]}))}},
 {t:'Impact: how bad?',k:'Scale 1 to 5 · use the worst category that applies',body:function(){return tbl(['Rating','Health and Safety','Reputation','Operational'],IMP.map(function(r){return ['<b>'+r[0]+' '+r[1]+'</b>',r[2],r[3],r[4]]}))}},
 {t:'Risk Exposure Matrix',k:'From the office Risk Legend · Occurrence + Impact',body:function(){
   var occ=[[5,'Almost certain'],[4,'Likely'],[3,'Possible'],[2,'Unlikely'],[1,'Rare']],imp=[[1,'Negligible'],[2,'Minor'],[3,'Moderate'],[4,'Significant'],[5,'Severe']];
   return '<div class="tw"><table class="t xm"><thead><tr><th>Occurrence ↓ · Impact →</th>'+imp.map(function(i){return '<th>'+i[0]+' '+i[1]+'</th>'}).join('')+'</tr></thead><tbody>'
   +occ.map(function(o){return '<tr><th>'+o[0]+' '+o[1]+'</th>'+imp.map(function(i){var r=rate(o[0],i[0]);return '<td class="'+band(r).c+'">'+r+'</td>'}).join('')+'</tr>'}).join('')
   +'</tbody></table></div><div class="xkey"><span><i class="low"></i><b>6 and below:</b> Accept</span><span><i class="high"></i><b>Above 6:</b> Reduce, Transfer / Share, or Avoid. The Committee must approve.</span></div>'}},
 {t:'Risk rating calculator',k:'Try it',body:function(){return '<div class="grid2"><div><span class="lab">Occurrence</span><div class="pick" id="pO"></div><span class="lab">Impact</span><div class="pick" id="pI"></div><div class="box" style="margin-top:14px"><b id="rLine"></b><div id="rBand"></div><div id="rTreat" class="muted"></div></div></div><div id="rMx"></div></div>'},init:function(root){
   var o=4,i=2;
   function pk(id,key){$(id,root).innerHTML=[1,2,3,4,5].map(function(n){return '<button data-k="'+key+'" data-n="'+n+'" class="'+((key==='o'?o:i)===n?'on':'')+'">'+n+'</button>'}).join('')}
   function draw(){pk('#pO','o');pk('#pI','i');var r=o+i,b=band(r);$('#rLine',root).textContent=o+' + '+i+' = '+r;$('#rBand',root).innerHTML=badge(r);$('#rTreat',root).textContent=committee(r)||'Name one person to watch it.';$('#rMx',root).innerHTML=matrix(o,i)}
   root.addEventListener('click',function(e){var b=e.target.closest('button[data-k]');if(!b)return;if(b.getAttribute('data-k')==='o')o=+b.getAttribute('data-n');else i=+b.getAttribute('data-n');draw()});
   draw();}},
 {t:'Worked example: rain',k:'Rate twice',body:function(){return tbl(['Step','What we write'],[['Risk','Rain on the day of an outdoor activity'],['Today (with Existing Controls)','Occurrence 5 (Almost certain: rainy season, rained out last year) + Impact 2 (Minor) = '+badge(7)+'. The Committee must approve.'],['Additional Controls (lowers Occurrence)','Reserve a covered venue as a backup; check the forecast two days before'],['Mitigation (lowers Impact)','Move the program indoors; call guardians if we must stop'],['Residual Risk Rating (target)','Occurrence 2 + Impact 1 = '+badge(3)]])+'<p class="muted">Costs money? Add the covered venue to the budget. This is how Part 2 loops back.</p>'}},
 {t:'What do we do with the rating?',k:'Risk Treatment · office Risk Legend',body:function(){return tbl(['Risk Rating','Treatment','What you do'],[['<b>6 and below</b>','<span class="bd low">ACCEPT</span>','Plan nothing extra. Name one person to watch it and rate it again if things change.'],['<b>Above 6</b>','<span class="bd high">REDUCE, TRANSFER / SHARE, or AVOID</span>','Reduce: add controls and mitigation. Transfer or share: agree in writing that a venue or partner carries part of it. Avoid: drop or redesign that part. <b>The Committee must approve.</b>']])+'<p>Never accept a risk by ignoring it. Accepting still means one named person watches it.</p>'}},
 {t:'Know the words',k:'Risk Register columns',body:function(){return tbl(['Word','What it is','Example'],[['Existing Controls','Already in place before you add anything new.','A signed venue permit'],['Additional Controls','Done before or during the activity to stop the risk or catch it early. Lowers Occurrence.','Safety briefing, headcounts'],['Mitigation','Limits the damage if the risk happens anyway. Lowers Impact.','First aid, call guardians'],['Action','The specific task, with an owner and a date, that puts a control or mitigation in place.','Safety officer buys and checks the first-aid kit by Nov 20'],['Residual Risk Rating','The rating you expect after Additional Controls and Mitigation. A target; recheck when done.','7 (Reduce) → 3 (Accept)'],['Owner','One named person accountable for the risk.','The safety officer']])}},
 {t:'Your team\'s biggest risk',k:'Team exercise',body:function(){return '<p>Think of the biggest risk to <b>your</b> activity.</p><ol><li>Describe it in one line.</li><li>Rate Occurrence and Impact as it stands today.</li><li>We rank every team\'s risk on the screen.</li></ol><p class="muted">Then fill in the rest of your Risk Register: Existing Controls, Additional Controls, Mitigation, and the Residual Risk Rating.</p>'},prompt:{base:'risk',type:'risk',q:'Your activity\'s biggest risk: describe it, then rate Occurrence and Impact as it stands today.'}},
 workSlide({t:'Team work: page 3, the Risk Register',k:'Team work · 25 min · proposal page 3',steps:[[6,'Rate the four starter risks','Occurrence + Impact = Risk Rating, for your own activity.'],[6,'Add two risks of your own','Use the 4Ws and H: Who, What, Where and When, How, Why.'],[8,'Controls, mitigation, actions','Each action has an owner and a date. Costs money? Add a line on page 2.'],[5,'Rate again','Residual Risk Rating. Still above 6? Flag it for the Committee.']],check:'Close with a round: another team names one risk you missed.'}),
]},
{id:'peer',n:'Peer review and approval',min:6,tag:'Swap drafts with a neighboring team for four minutes, then walk through who signs next.',slides:[
 {t:'Peer review',k:'4 min · swap drafts with a neighboring team',body:function(){return tbl(['Page','Check'],[['<b>Page 1</b>','Every objective has a KPI and a target, and the evaluation says how it will be checked. Every program item has one named owner. Under-18 count, adult supervisors, and venue address are filled in.'],['<b>Page 2</b>','Every line has Qty, Unit, Unit Cost and Total, and the total adds up. Every cost traces to a program item. Cost per participant is written. Every action on page 3 that costs money has a budget line.'],['<b>Page 3</b>','Every risk has an Occurrence Rating, Impact Rating, controls, mitigation, and one named owner. At least two risks are specific to this activity. Any risk rated above 6 is flagged for the Committee.'],['<b>Attachments</b>','Guardian consent or waiver, data privacy notice, permit or MOA, participant list.']])+'<p class="muted">Tell them one thing that is strong and one thing to fix.</p>'},prompt:{base:'peer',type:'scale',q:'How ready is the plan you reviewed? 1 = needs work, 5 = ready to implement.'}},
 {t:'Who signs next',k:'2 min · approval path',body:function(){return '<ol class="steps"><li><b>Proponent</b> prepares and signs the proposal.</li><li><b>Risk and Safety Committee</b> pre-approves it, with conditions if needed, or returns it.</li><li><b>SK Chairperson</b> gives final approval for endorsement.</li><li><b>Barangay Council</b> endorses it.</li><li>After approval, the content goes into the <b>activity design</b> or other document the government requires. Confirm the format with the local office first.</li></ol><p><b>Another team caught something you missed.</b> Which habit is that?</p>'},prompt:{base:'hpeer',type:'choice',q:'Habit check: Another team caught a risk you missed, and your draft got better. Which habit?',options:['1 Be Proactive','2 Begin with the End in Mind','3 Put First Things First','4 Think Win-Win','5 Seek First to Understand','6 Synergize','7 Sharpen the Saw'],correct:5}}
]},
{id:'pres',n:'Team presentations',min:16,tag:'Each team presents its working draft in 3 minutes. Phones rate each plan.',slides:[
 {t:'Team presentations',k:'3 min per team',body:function(){return '<div class="grid3" style="margin-top:0"><div class="box"><b>Idea · 1 min</b>Why it is needed, what it is, who benefits, and the main objective with its KPI and target.</div><div class="box"><b>Budget · 1 min</b>The total, and the biggest line and what it buys.</div><div class="box"><b>Top risk · 1 min</b>Risk Rating and Residual Risk Rating, one control, one mitigation, one action with an owner and a date.</div></div><div class="box" style="margin-top:12px"><div class="row" style="align-items:center"><span class="big tmr" id="pt" style="min-width:0">3:00</span><button class="btn sm" data-p="120">2 min</button><button class="btn sm" data-p="180">3 min</button><button class="btn sm" data-p="240">4 min</button><button class="btn sm pri" data-act="ptgo">Start / pause</button></div></div><p class="muted">Push the rating to phones after each team.</p>'},init:function(root,cleanup){

   root.addEventListener('click',function(e){var p=e.target.getAttribute('data-p');if(p){left=+p;run=false;draw()}else if(e.target.getAttribute('data-act')==='ptgo'){run=!run}});draw();},prompt:{base:'pres',type:'scale',q:'Rate the plan you just heard. 1 = needs work, 5 = ready to implement.'}}
]},
{id:'close',n:'Closing',min:6,tag:'Close the loop: plan, budget, and risks check each other. One change per team, then the rapid habit round.',slides:[
 {t:'Close the loop',k:'Closing · three questions every reviewer asks',body:function(){return '<div class="loop">'

/* ---------- server calls (Cloudflare Worker) ---------- */
function api(path,o){o=o||{};var init={method:o.body?'POST':'GET',headers:{},cache:'no-store'};if(o.key)init.headers['X-Key']=o.key;if(o.body){init.headers['Content-Type']='application/json';init.body=JSON.stringify(o.body)}return fetch(path,init).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
var chainL=Promise.resolve(),chainM=Promise.resolve();
var liveBusy=0;
function setLive(next){live=next;renderPanel();liveBusy++;
  chainL=chainL.then(function(){return api('/api/live',{key:KEY,body:next})}).then(function(){netOk(true)}).catch(function(){netOk(false);flash('Could not update the phones. Check the connection and try again.')}).then(function(){liveBusy--});return chainL}
/* Answers are kept on the phone first. If sending fails, we retry when the connection comes back. */
function saveMine(){var d=JSON.parse(JSON.stringify(mine));unsent=true;try{localStorage.setItem('iti_mine',JSON.stringify(d))}catch(e){}
  chainM=chainM.then(function(){return api('/api/me',{body:{cid:uid,doc:d}})}).then(function(r){if(r&&r.team){d.team=r.team;savedTeam=r.team;if(mine&&mine.team!==r.team){mine=Object.assign({},mine,{team:r.team});try{localStorage.setItem('iti_mine',JSON.stringify(mine))}catch(x){}}}if(JSON.stringify(mine)===JSON.stringify(d))unsent=false;netOk(true);return true}).catch(function(e){if(String(e.message)==='423'){unsent=false;mine=null;draft={name:d.name,brgy:d.barangay};try{localStorage.removeItem('iti_mine')}catch(x){}loadTeams();flash('Registration is closed. Please tell the facilitator.');return false}
    if(String(e.message)==='409'){unsent=false;mine=Object.assign({},mine,{editProfile:true});draft={name:d.name,brgy:d.barangay};try{localStorage.removeItem('iti_mine')}catch(x){}flash('All houses are full right now. Please tell the facilitator, then tap Join again.');return false}
    if(String(e.message)==='400'&&!savedTeam&&mine&&!mine.team){unsent=false;mine=Object.assign({},mine,{editProfile:true});draft={name:d.name};loadTeams();flash('Please pick your barangay again.');return false}
    if(String(e.message)==='400'){unsent=false;flash('That answer could not be saved.');return false}netOk(false);return false});
  return chainM.then(function(ok){if(mode==='phone')renderPhone();return ok})}
/* Houses are assigned by the presenter after registration; phones then fetch their own record. */
function refreshMe(){if(mode!=='phone'||!mine||mine.team)return;api('/api/me?cid='+encodeURIComponent(uid)).then(function(m){if(m&&m.team&&mine&&!mine.team){mine=Object.assign({},mine,{team:m.team});savedTeam=m.team;try{localStorage.setItem('iti_mine',JSON.stringify(mine))}catch(e){}renderPhone()}}).catch(function(){})}
function retryUnsent(){if(unsent&&mine&&mode==='phone'&&epochKnown)saveMine()}
/* After "Clear all answers" the server's epoch goes up: forget this phone's old copy and join again. */
var epochKnown=false;
function onEpoch(ep){if(typeof ep!=='number'||mode!=='phone')return;var had=null;try{had=localStorage.getItem('iti_epoch');localStorage.setItem('iti_epoch',String(ep))}catch(e){}
  var first=!epochKnown;epochKnown=true;
  if(had!==null&&had!==String(ep)){mine=null;unsent=false;draft={};editing=false;lastView='';try{localStorage.removeItem('iti_mine');localStorage.removeItem('iti_draft')}catch(e){}renderPhone();return}
  if(first)retryUnsent()}

function answersFor(pid){var out=[];resp.forEach(function(r){var a=r.data.answers&&r.data.answers[pid];if(a)out.push({team:r.data.team,name:r.data.name,brgy:r.data.barangay,v:a.v,t:a.t||0})});return out.sort(function(a,b){return b.t-a.t})}
function summarize(p){var A=answersFor(p.id),res={n:A.length};
  if(p.type==='choice'){res.counts=(p.options||[]).map(function(_,i){return A.filter(function(a){return a.v===i}).length});if(p.correct!=null)res.correct=p.correct}
  if(p.type==='number'&&p.correct!=null){res.correct=p.correct;res.right=A.filter(function(a){return Number(a.v)===p.correct}).length}
  if(p.type==='scale'&&A.length){res.avg=Math.round(A.reduce(function(s,a){return s+Number(a.v)},0)/A.length*10)/10}
  return res}
function resultsHTML(p){var A=answersFor(p.id);if(!A.length)return '<p class="muted">No answers yet.</p>';
  var who=function(a){return esc(showNames&&a.name?a.name+(a.brgy?' · '+a.brgy:'')+' · ':'')+esc(houseLabel(a.team))};
  if(p.type==='text')return '<div class="wall">'+A.map(function(a){return '<div class="note">'+esc(a.v)+'<small>'+who(a)+'</small></div>'}).join('')+'</div>';
  if(p.type==='choice'){var s=summarize(p),max=Math.max.apply(null,s.counts.concat([1]));return p.options.map(function(o,i){return '<div class="bar'+(p.correct===i?' right':'')+'"><span>'+esc(o)+(p.correct===i?' ✓':'')+'</span><b>'+s.counts[i]+'</b><div class="tr"><i style="width:'+(s.counts[i]/max*100)+'%"></i></div></div>'}).join('')}
  if(p.type==='number'){var r='<div class="row">'+A.map(function(a){return '<span class="chip'+(p.correct!=null&&Number(a.v)===p.correct?' ok':'')+'">'+esc(a.v)+'</span>'}).join('')+'</div>';if(p.correct!=null)r+='<p>Correct: <b>'+p.correct+'</b>. '+summarize(p).right+' of '+A.length+' got it.</p>';return r}
  if(p.type==='scale'){var c=[0,0,0,0,0];A.forEach(function(a){c[a.v-1]++});var mx=Math.max.apply(null,c.concat([1]));return '<p>Average <b>'+summarize(p).avg+'</b> from '+A.length+'</p>'+c.map(function(n,i){return '<div class="bar"><span>'+(i+1)+'</span><b>'+n+'</b><div class="tr"><i style="width:'+(n/mx*100)+'%"></i></div></div>'}).join('')}
  if(p.type==='risk'){A=A.filter(function(a){return a.v&&typeof a.v==='object'});var rows=A.slice().sort(function(a,b){return rate(b.v.occ,b.v.imp)-rate(a.v.occ,a.v.imp)});return '<div class="tw"><table class="t"><thead><tr><th>Risk</th><th class="num">Occ</th><th class="num">Imp</th><th>Rating</th><th>House</th></tr></thead><tbody>'+rows.map(function(a){return '<tr><td>'+esc(a.v.text)+'</td><td class="num">'+esc(a.v.occ)+'</td><td class="num">'+esc(a.v.imp)+'</td><td>'+badge(rate(a.v.occ,a.v.imp)||0)+'</td><td>'+who(a)+'</td></tr>'}).join('')+'</tbody></table></div>'}
  return ''}

  /* phone */
  else if(a==='brgy'){draft.brgy=(teamInfo.barangays||[])[+d.b]||'';var n=$('#jname');if(n)draft.name=n.value;renderPhone()}
  else if(a==='joingo'){var nm=($('#jname').value||'').trim();if(!nm)return flash('Enter your first name.');var jb=$('#jbrgy'),bg=jb?(jb.value||'').trim():(draft.brgy||'');if(!bg)return flash('Pick your barangay.');
    mine={name:nm,barangay:bg,team:(mine&&mine.team)||0,answers:(mine&&mine.answers)||{},joinedAt:(mine&&mine.joinedAt)||Date.now()};draft={name:nm,brgy:bg};renderPhone();saveMine()}
  else if(a==='editprof'){mine=Object.assign({},mine,{editProfile:true});draft={name:mine.name,brgy:mine.barangay};renderPhone()}
  else if(a==='pick'){draft.v=+d.n;keepText();saveDraft();renderPhone()}
  else if(a==='occ'){draft.occ=+d.n;keepText();saveDraft();renderPhone()}
  else if(a==='imp'){draft.imp=+d.n;keepText();saveDraft();renderPhone()}
  else if(a==='send')sendAnswer();
  else if(a==='edit'){editing=true;var pr=live&&live.prompt,old=pr&&mine.answers&&mine.answers[pr.id];draft={pid:pr.id,name:draft.name,team:draft.team};if(old){if(pr.type==='choice'||pr.type==='scale')draft.v=old.v;else if(pr.type==='risk'){draft.occ=old.v.occ;draft.imp=old.v.imp;draft.text=old.v.text}else draft.text=String(old.v)}renderPhone();var t=$('#din');if(t&&old&&pr.type==='number')t.value=old.v}
}
function keepText(){var t=$('#din');if(t)draft.text=t.value}
async function clearAll(){try{await api('/api/clear',{key:KEY,body:{}});resp=[];used={};saveUsed();showUsed=false;await setLive({prompt:null,open:false,result:null,ts:Date.now()});flash('All answers cleared.');renderPresenter()}catch(e){flash('Could not clear. Check the connection.')}}

/* ---------- boot ---------- */
function unlockForm(msg){app.innerHTML='<div class="phone"><div><div class="brand">Facilitator</div><h1>From Ideas to Impact</h1></div><div class="card"><label class="lab">Presenter passcode</label><input type="password" id="pk" style="width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:42px" autocomplete="current-password">'+(msg?'<p style="color:var(--bad)">'+esc(msg)+'</p>':'')+'<div class="row"><button class="btn pri" data-act="unlock">Open presenter view</button></div></div></div>'}
async function startHost(k){try{await api('/api/responses',{key:k});KEY=k;loadTeams().then(updHouses);try{sessionStorage.setItem('iti_key',k)}catch(e){}isOwner=true;mode='presenter';return true}catch(e){return false}}

/* ---------- live connection ----------
   One WebSocket per screen; the server pushes the question when it changes, so
   40 phones cost a few thousand requests per session instead of ~144,000 polls.
   If the socket cannot connect, we fall back to a slow poll (every 5 s, paused
   while the phone screen is off). Failures never clear the screen: we show a
   small "Reconnecting" bar and keep everything the person typed. */
var net={ok:true,ws:false},sock=null,wsTry=0,wsTimer=null,pingTimer=null,pongWait=null,fbTimer=null,netStarted=false,lastView='',lastRev=-1,respBusy=false,respAgain=false,respTimer=null,netBar=null;
function netOk(ok){var was=net.ok;net.ok=ok||net.ws;showNet();if(!was&&net.ok)retryUnsent()}
function showNet(){if(!netBar){netBar=document.createElement('div');netBar.id='net';netBar.setAttribute('role','status');document.body.appendChild(netBar)}
  netBar.textContent=net.ok?'':(mode==='phone'?'Reconnecting… Your answers stay on this phone.':'Reconnecting… Phones keep their answers.');
  netBar.style.display=net.ok?'none':'block';
  document.querySelectorAll('.netchip').forEach(function(el){el.outerHTML=statusChip()})}
function onLive(l){
  if(mode==='presenter'){if(liveBusy)return;var cur=JSON.stringify(live),nx=JSON.stringify(l);if(cur!==nx){live=l;renderPanel()}return}
  live=l;var p=l&&l.prompt,key=JSON.stringify([p&&p.id,l&&l.open,l&&l.result]);
  if(key===lastView)return;lastView=key;
  if(editing&&!(p&&mine&&mine.answers&&mine.answers[p.id]))editing=false;
  renderPhone()}
function onRev(r){if(r===lastRev)return;lastRev=r;loadResp()}
/* Fetch answers for the presenter; at most one request in flight, coalescing bursts. */
function loadResp(){if(!isOwner)return;if(respBusy){respAgain=true;return}respBusy=true;
  api('/api/responses',{key:KEY}).then(function(r){netOk(true);var n=JSON.stringify(r);if(n!==JSON.stringify(resp)){resp=r;if(mode==='presenter'){updJoined();renderPanel()}}}).catch(function(){netOk(false)})
  .then(function(){setTimeout(function(){respBusy=false;if(respAgain){respAgain=false;loadResp()}},800)})}
function wsUrl(){return (location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/api/ws'+(isOwner?'?role=host':'')}
function connect(){clearTimeout(wsTimer);if(sock||!('WebSocket' in window))return startFallback();
  var ws;try{ws=new WebSocket(wsUrl())}catch(e){return startFallback()}sock=ws;
  ws.onopen=function(){wsTry=0;net.ws=true;netOk(true);stopFallback();refreshMe();clearInterval(pingTimer);
    pingTimer=setInterval(function(){if(ws.readyState!==1)return;try{ws.send('ping')}catch(e){}clearTimeout(pongWait);pongWait=setTimeout(function(){try{ws.close()}catch(e){}},10000)},25000)};
  ws.onmessage=function(ev){clearTimeout(pongWait);if(ev.data==='pong')return;var m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.me){refreshMe();return}
    if('epoch' in m)onEpoch(m.epoch);if('live' in m)onLive(m.live);if('rev' in m)onRev(m.rev)};
  ws.onclose=function(){if(sock!==ws)return;sock=null;net.ws=false;clearInterval(pingTimer);clearTimeout(pongWait);
    startFallback();var wait=Math.min(15000,1000*Math.pow(2,wsTry++))+Math.random()*1000;wsTimer=setTimeout(connect,wait)};
  ws.onerror=function(){}}
function dropSocket(){if(sock){var w=sock;sock=null;net.ws=false;try{w.close()}catch(e){}}clearInterval(pingTimer);clearTimeout(pongWait)}
function pollOnce(){if(document.hidden&&mode==='phone')return;
  refreshMe();api('/api/live').then(function(r){netOk(true);onEpoch(r&&r.epoch);onLive(r?r.live:null)}).catch(function(){netOk(false)});
  if(isOwner)loadResp()}
function startFallback(){if(fbTimer)return;pollOnce();fbTimer=setInterval(function(){if(!net.ws)pollOnce()},5000)}
function stopFallback(){clearInterval(fbTimer);fbTimer=null}
function startNet(){if(netStarted)return;netStarted=true;connect();
  if(isOwner){loadResp();respTimer=setInterval(function(){loadResp();loadTeams()},20000)} /* safety refresh, ~360 requests per 2 h */
  window.addEventListener('offline',function(){dropSocket();netOk(false);startFallback()});
  window.addEventListener('online',function(){wsTry=0;clearTimeout(wsTimer);connect();pollOnce()});
  document.addEventListener('visibilitychange',function(){if(document.hidden)return;if(!sock){wsTry=0;connect()}pollOnce();retryUnsent()})}

async function boot(){
  try{uid=localStorage.getItem('iti_cid');if(!uid){uid='c'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem('iti_cid',uid)}}catch(e){uid='c'+Math.random().toString(36).slice(2,10)}
  try{var dr=JSON.parse(localStorage.getItem('iti_draft')||'null');if(dr&&dr.pid)draft=dr}catch(e){}
  var host=location.search.indexOf('host')>=0;
  if(host){var k='';try{k=sessionStorage.getItem('iti_key')||''}catch(e){}
    if(!(k&&await startHost(k))){mode='lock';unlockForm();return}}
  else mode='phone';
  try{var v=JSON.parse(sessionStorage.getItem('iti_view')||'null');if(v&&v.t==='slide'&&SEGS[v.s]&&SEGS[v.s].slides[v.i])view=v}catch(e){}
  if(mode==='presenter'){renderPresenter();startNet();return}
  /* Phone: use the copy saved on this phone right away, then check with the server. */
  var local=null;try{local=JSON.parse(localStorage.getItem('iti_mine')||'null')}catch(e){}
  try{var m=await api('/api/me?cid='+encodeURIComponent(uid));if(m&&m.name){mine=m;savedTeam=m.team}
    /* Server copy wins unless this phone has answers that never reached it. */
    if(local&&local.name&&(!m||Object.keys(local.answers||{}).some(function(k){return !(m.answers||{})[k]}))){mine=local;unsent=true}
    else if(!m)mine=null}
  catch(e){if(local&&local.name){mine=local;unsent=true}netOk(false)}
  renderPhone();startNet()}
app.addEventListener('click',async function(e){var b=e.target.closest('[data-act=unlock]');if(!b)return;var k=($('#pk').value||'').trim();if(await startHost(k)){renderPresenter();startNet()}else unlockForm('That passcode did not work.')});
boot();
})();
</script>
